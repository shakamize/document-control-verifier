name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: every fixture verifies
        run: |
          set -e
          for file in fixtures/*.json; do
            node verify-trail.mjs "$file"
          done
      - name: an altered fixture is reported broken
        run: |
          set -e
          for file in fixtures/*.json; do
            sed 's/"spaceKey": "QMS"/"spaceKey": "OPS"/' "$file" > altered.json
            if node verify-trail.mjs altered.json; then
              echo "an altered export was not reported broken" "$file"
              exit 1
            fi
          done

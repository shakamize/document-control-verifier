name: release

on:
  push:
    branches: [main]
    paths:
      - 'verify-trail.mjs'
      - 'fixtures/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: archive the fixtures directory as it stands at this commit
        run: |
          set -e
          git archive --format=zip HEAD fixtures > fixtures.zip

      - name: every fixture in the archive it attaches verifies
        run: |
          set -e
          mkdir -p attached
          unzip -q fixtures.zip -d attached
          cd attached
          for file in fixtures/*.json; do
            node ../verify-trail.mjs "$file"
          done

      - name: publish the release, with the digest of the bytes it attaches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          digest=$(shasum -a 256 verify-trail.mjs | cut -d' ' -f1)
          fixtures_digest=$(shasum -a 256 fixtures.zip | cut -d' ' -f1)

          latest=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$latest" ]; then
            mkdir -p published
            gh release download "$latest" -p verify-trail.mjs -D published
            already=$(shasum -a 256 published/verify-trail.mjs | cut -d' ' -f1)
            if [ "$already" = "$digest" ] && git diff --quiet "$latest" HEAD -- fixtures; then
              echo "The latest release already attaches this verify-trail.mjs and these fixtures. Nothing to release." "$latest"
              exit 0
            fi
          fi

          next=$(node .github/next-version.mjs "$latest")
          if gh release view "$next" >/dev/null 2>&1; then
            echo "Refusing to republish. A released digest describes a file somebody may already hold," "$next"
            echo "so it is never overwritten, and the release after the latest one already exists."
            exit 1
          fi

          {
            echo "\`verify-trail.mjs\` for this release, and the SHA-256 of the exact files attached below."
            echo
            echo '```'
            echo "$digest  verify-trail.mjs"
            echo "$fixtures_digest  fixtures.zip"
            echo '```'
            echo
            echo "Check your copy with \`shasum -a 256 verify-trail.mjs\`, or on Windows"
            echo "\`certutil -hashfile verify-trail.mjs SHA256\`. This digest is computed by the"
            echo "release job from the bytes it attaches, so it is not a value anybody typed."
            echo "The verifier prints the same digest, of itself, on the first line of every run."
            echo
            echo "\`fixtures.zip\` is the \`fixtures\` directory at this release, one frozen export per format."
            echo "Extract it beside \`verify-trail.mjs\` and run the verifier against each fixture before"
            echo "you trust it with your own record."
          } > notes.md
          gh release create "$next" verify-trail.mjs fixtures.zip LICENSE NOTICE \
            --target "$GITHUB_SHA" --title "$next" --notes-file notes.md

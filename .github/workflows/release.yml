name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: the tag names the version the file carries
        run: |
          set -e
          declared=$(node -e "process.stdout.write(/const VERSION = '([^']+)'/.exec(require('node:fs').readFileSync('verify-trail.mjs','utf8'))[1])")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME does not name the version in verify-trail.mjs, which is $declared"
            exit 1
          fi

      - name: archive the fixtures directory as it stands at this tag
        run: |
          set -e
          git archive --format=zip HEAD fixtures > fixtures.zip

      - name: every fixture in the archive it attaches verifies
        run: |
          set -e
          mkdir -p attached
          unzip -q fixtures.zip -d attached
          cd attached
          for file in fixtures/*.json; do
            node ../verify-trail.mjs "$file"
          done

      - name: publish the release, with the digest of the bytes it attaches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          digest=$(shasum -a 256 verify-trail.mjs | cut -d' ' -f1)
          fixtures_digest=$(shasum -a 256 fixtures.zip | cut -d' ' -f1)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p published
            gh release download "$GITHUB_REF_NAME" -p verify-trail.mjs -D published
            already=$(shasum -a 256 published/verify-trail.mjs | cut -d' ' -f1)
            if [ "$already" = "$digest" ]; then
              echo "$GITHUB_REF_NAME is already released and its attached file is the file at this tag. Nothing to do."
              exit 0
            fi
            echo "$GITHUB_REF_NAME is already released, and the file attached to it is NOT the file at this tag."
            echo "  attached to the release: $already"
            echo "  at this tag:             $digest"
            echo "Refusing to republish. A released digest describes a file somebody may already hold,"
            echo "so it is never overwritten. Release the new file under a new version instead."
            exit 1
          fi

          {
            echo "\`verify-trail.mjs\` for this release, and the SHA-256 of the exact files attached below."
            echo
            echo '```'
            echo "$digest  verify-trail.mjs"
            echo "$fixtures_digest  fixtures.zip"
            echo '```'
            echo
            echo "Check your copy with \`shasum -a 256 verify-trail.mjs\`, or on Windows"
            echo "\`certutil -hashfile verify-trail.mjs SHA256\`. This digest is computed by the"
            echo "release job from the bytes it attaches, so it is not a value anybody typed."
            echo
            echo "\`fixtures.zip\` is the \`fixtures\` directory at this tag, one frozen export per format."
            echo "Extract it beside \`verify-trail.mjs\` and run the verifier against each fixture before"
            echo "you trust it with your own record."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" verify-trail.mjs fixtures.zip LICENSE NOTICE \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
